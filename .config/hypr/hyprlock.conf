label {
    monitor =
    text = cmd[update:3000] $HOME/.local/bin/note --lock 4
    color = rgba(166, 227, 161, 0.95)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = -50, -455
    halign = right
    valign = top
    shadow_passes = 2
}
