general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = screenshot

    blur_passes = 3
    blur_size = 8

    brightness = 0.55
    vibrancy = 0.15
}

# BIG CLOCK
label {
    monitor =
    text = $TIME
    color = rgba(205, 214, 244, 1.0)

    font_size = 90
    font_family = JetBrainsMono Nerd Font

    position = 0, 170
    halign = center
    valign = center

    shadow_passes = 2
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date "+%A, %B %d"
    color = rgba(166, 173, 200, 1.0)

    font_size = 20
    font_family = JetBrainsMono Nerd Font

    position = 0, 90
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text = $USER
    color = rgba(137, 180, 250, 1.0)

    font_size = 18
    font_family = JetBrainsMono Nerd Font

    position = 0, 15
    halign = center
    valign = center
}

# PASSWORD BOX
input-field {
    monitor =

    size = 320, 55
    outline_thickness = 2

    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true

    outer_color = rgba(137, 180, 250, 0.9)
    inner_color = rgba(30, 30, 46, 0.75)
    font_color = rgba(205, 214, 244, 1.0)

    font_family = JetBrainsMono Nerd Font

    placeholder_text = <i>Password...</i>

    fade_on_empty = false
    rounding = 15

    check_color = rgba(166, 227, 161, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)

    position = 0, -60
    halign = center
    valign = center

    shadow_passes = 2
}

# STICKY NOTES
# Four slots filled by `note --lock <n>`. An empty slot renders nothing,
# so the stack only shows as many notes as you have. Anchored to the
# top right corner and spaced for notes up to 5 lines tall.
label {
    monitor =
    text = cmd[update:3000] $HOME/.local/bin/note --lock 1
    color = rgba(249, 226, 175, 0.95)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = -50, -50
    halign = right
    valign = top
    shadow_passes = 2
}

label {
    monitor =
    text = cmd[update:3000] $HOME/.local/bin/note --lock 2
    color = rgba(250, 179, 135, 0.95)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = -50, -185
    halign = right
    valign = top
    shadow_passes = 2
}

label {
    monitor =
    text = cmd[update:3000] $HOME/.local/bin/note --lock 3
    color = rgba(245, 194, 231, 0.95)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = -50, -320
    halign = right
    valign = top
    shadow_passes = 2
