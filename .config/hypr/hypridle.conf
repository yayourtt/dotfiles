general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'

    # Hold off suspend until hyprlock reports the session is locked, so the
    # desktop never flashes on resume before the lock screen appears.
    inhibit_sleep = 3
}

# Lock after 15 minutes
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# No DPMS-off listener on purpose: Hyprland was freezing (and getting killed by
# the start-hyprland watchdog) when the screens were turned back on. Suspend at
# 45 minutes turns the screens off anyway.

# Suspend after 45 minutes
listener {
    timeout = 2700
    on-timeout = systemctl suspend
}
