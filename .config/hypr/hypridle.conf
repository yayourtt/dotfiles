general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'

    # Hold off suspend until hyprlock reports the session is locked, so the
    # desktop never flashes on resume before the lock screen appears.
    inhibit_sleep = 3
}

# Dim the screen after 14 minutes as a warning; any input restores it
listener {
    timeout = 840
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Lock after 15 minutes
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# Turn the monitor off after 30 minutes
listener {
    timeout = 1800
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Suspend after 45 minutes
listener {
    timeout = 2700
    on-timeout = systemctl suspend
}
